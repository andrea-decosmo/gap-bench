[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gap-bench"
version = "0.1.0"
description = "A diagnostic benchmark for AI protection of vulnerable users"
readme = "README.md"
authors = [{name = "Andrea De Cosmo"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "ollama>=0.6",
]

[project.optional-dependencies]
closed = [
  "anthropic>=0.34",
  "google-genai>=0.1",
  "openai>=1.30",   # used for OpenRouter (OpenAI-compatible API)
]
dev = [
  "pytest",
]

[project.urls]
Homepage = "https://github.com/andrea-decosmo/gap-bench"
Repository = "https://github.com/andrea-decosmo/gap-bench"
Issues = "https://github.com/andrea-decosmo/gap-bench/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
